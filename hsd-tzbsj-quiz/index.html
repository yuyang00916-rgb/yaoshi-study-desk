    "type": "fill",
    "prompt": "团章规定，团员______人以上的单位，应当建立团的基层组织。",
    "answer": "三（3）",
    "basis": "《中国共产主义青年团章程》第五章“团的基层组织”。"
  },
  {
    "id": 159,
    "type": "fill",
    "prompt": "团章规定，团的全国代表大会每______年举行一次。",
    "answer": "五",
    "basis": "《中国共产主义青年团章程》第三章。"
  },
  {
    "id": 160,
    "type": "fill",
    "prompt": "团的基层组织选举中，差额不少于应选人数的___。",
    "answer": "20%",
    "basis": "《中国共产主义青年团基层组织选举工作条例》第十一条。"
  },
  {
    "id": 161,
    "type": "fill",
    "prompt": "《中国共产主义青年团章程》于______年修改通过。",
    "answer": "2023",
    "basis": "2023年6月22日经中国共产主义青年团第十九次全国代表大会部分修改通过。"
  },
  {
    "id": 162,
    "type": "fill",
    "prompt": "团章规定，中国共产主义青年团团旗旗面为红色，左上角缀黄色五角星，周围环绕______。",
    "answer": "黄色圆圈",
    "basis": "《中国共产主义青年团章程》第七章“团旗、团徽、团歌”。"
  },
  {
    "id": 163,
    "type": "fill",
    "prompt": "中国共产主义青年团团徽的绶带上写有“______”五个字。",
    "answer": "中国共青团",
    "basis": "《中国共产主义青年团章程》第七章“团旗、团徽、团歌”。"
  },
  {
    "id": 164,
    "type": "fill",
    "prompt": "团的经费来源主要包括团员交纳的______、党和政府以及企事业单位的拨款等。",
    "answer": "团费",
    "basis": "《中国共产主义青年团章程》第九章“团的经费”。"
  },
  {
    "id": 165,
    "type": "fill",
    "prompt": "团章规定，团员在留团察看期间没有______、选举权和被选举权。",
    "answer": "表决权",
    "basis": "《中国共产主义青年团章程》第六章“团的纪律”。"
  },
  {
    "id": 166,
    "type": "fill",
    "prompt": "团员由一个基层组织转移到另一个基层组织，应当在“______”系统中办理组织关系转接。",
    "answer": "智慧团建",
    "basis": "《中国共产主义青年团章程》第一章“团员”第六条；具体业务在“智慧团建”系统中办理。"
  },
  {
    "id": 167,
    "type": "fill",
    "prompt": "推荐优秀共青团员作党的发展对象，应当政治思想上先进、道德品行上先进、发挥作用上先进、______上先进。",
    "answer": "执行纪律",
    "basis": "《共青团推优入党工作实施办法》。"
  },
  {
    "id": 168,
    "type": "fill",
    "prompt": "团支部委员会一般由______人组成，设书记一人，可以设副书记一人。",
    "answer": "3至5",
    "basis": "《中国共产主义青年团章程》第五章“团的基层组织”。"
  },
  {
    "id": 169,
    "type": "fill",
    "prompt": "团的组织对团员作出处分决定，应当坚持______、治病救人的方针。",
    "answer": "惩前毖后",
    "basis": "《中国共产主义青年团章程》第六章“团的纪律”。"
  }
];
</script>
<script>
'use strict';

const questionTypes = {
  single: '单选题',
  multiple: '多选题',
  judge: '判断题',
  fill: '填空题'
};
const filters = { all: '全部题目', ...questionTypes, mistakes: '错题本' };
const storageKey = 'hsd-tzbsj-practice-3-v1';
const get = id => document.getElementById(id);
const questionView = get('question');
const filterBar = get('filters');
const orderBar = get('sequence');
const mapPanel = get('map');
const mapToggle = get('toggle-map');

let storageAvailable = true;
let saved = {};
try {
  saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {};
} catch {
  storageAvailable = false;
}
const results = saved.results || {};
const positions = saved.positions || {};
const drafts = new Map();
const retries = new Set();
let filter = Object.hasOwn(filters, saved.filter) ? saved.filter : 'all';
let order = saved.order === 'random' ? 'random' : 'ordered';
let queue = [];
let index = 0;
let summary = false;

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({ results, positions, filter, order }));
    storageAvailable = true;
  } catch {
    storageAvailable = false;
  }
  get('storage-note').textContent = storageAvailable
    ? '练习进度和错题保存在当前浏览器。'
    : '当前浏览器无法保存进度，关闭或刷新页面后会清空。';
}

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content !== undefined) node.textContent = content;
  return node;
}

function button(text, className, handler) {
  const node = element('button', className, text);
  node.type = 'button';
  if (handler) node.addEventListener('click', handler);
  return node;
}

function matches(question, scope) {
  if (scope === 'all') return true;
  if (scope === 'mistakes') return results[question.id]?.correct === false;
  return question.type === scope;
}

function makeQueue(preferredId) {
  queue = questions.filter(question => matches(question, filter));
  if (order === 'random') {
    for (let current = queue.length - 1; current > 0; current--) {
      const other = Math.floor(Math.random() * (current + 1));
      [queue[current], queue[other]] = [queue[other], queue[current]];
    }
  }
  index = Math.max(0, queue.findIndex(question => question.id === preferredId));
  summary = false;
}

function chooseFilter(scope) {
  if (filter === scope) return;
  filter = scope;
  makeQueue(positions[filter]);
  render();
}

function chooseOrder(nextOrder) {
  if (order === nextOrder) return;
  order = nextOrder;
  makeQueue(order === 'ordered' ? queue[index]?.id : undefined);
  render();
}

function goTo(nextIndex) {
  index = nextIndex;
  summary = false;
  render();
  get('prompt')?.focus();
}

function updateOverview() {
  const answered = Object.keys(results).length;
  const correct = Object.values(results).filter(result => result.correct).length;
  get('answered-total').textContent = String(answered);
  get('total-label').textContent = ` / ${questions.length} 题`;
  get('score').textContent = `答对 ${correct} 题`;
  get('progress').max = questions.length;
  get('progress').value = answered;
  for (const item of filterBar.querySelectorAll('button')) {
    const scope = item.dataset.filter;
    item.setAttribute('aria-pressed', String(scope === filter));
    item.lastElementChild.textContent = String(questions.filter(question => matches(question, scope)).length);
  }
  for (const item of orderBar.querySelectorAll('button')) {
    item.setAttribute('aria-pressed', String(item.dataset.order === order));
  }
}

function renderMap() {
  const grid = get('map-grid');
  if (mapPanel.hidden) return;
  const items = queue.map((question, nextIndex) => {
    const attempt = results[question.id];
    const status = attempt?.correct === true ? '答对' : attempt ? '错题' : '未做';
    const className = attempt?.correct === true ? 'correct' : attempt ? 'wrong' : '';
    const item = button(question.id, className, () => {
      toggleMap(false);
      goTo(nextIndex);
    });
    item.setAttribute('aria-label', `第 ${question.id} 题，${status}`);
    if (!summary && nextIndex === index) item.setAttribute('aria-current', 'true');
    return item;
  });
  grid.replaceChildren(...items);
}

function toggleMap(open) {
  mapPanel.hidden = !open;
  mapToggle.setAttribute('aria-expanded', String(open));
  renderMap();
}

function normalize(value) {
  return value.normalize('NFKC')
    .toLowerCase()
    .replace(/[\s,、，。！!？?《》“”「」]/gu, '')
    .replace(/[—–－~～至到]/gu, '-');
}

const fillAliases = {
  141: ['党中央', '党的'],
  147: ['2026-2030', '2026年-2030年', '2026年-2030'],
  148: ['1945年'],
  150: ['1922年'],
  152: ['北京市'],
  154: ['6个月或一年', '六个月或1年', '6个月或1年'],
  158: ['三', '3'],
  159: ['5'],
  160: ['百分之二十'],
  161: ['2023年'],
  168: ['三至五', '3-5', '三-五']
};

function isCorrect(question, values) {
  if (question.options) return [...values].sort().join('') === question.answer;
  const normalized = values.map(normalize);
  if (question.id === 153) {
    return ['十四', '14'].includes(normalized[0]) && ['二十八', '28'].includes(normalized[1]);
  }
  return [question.answer, ...(fillAliases[question.id] || [])]
    .some(answer => normalize(answer) === normalized[0]);
}

function answerText(question) {
  if (question.type === 'fill') return question.answer;
  return question.options
    .filter(([key]) => question.answer.includes(key))
    .map(([key, value]) => `${key} ${value}`)
    .join('；');
}

function renderFeedback(panel, question, attempt, revealed) {
  panel.hidden = !attempt && !revealed;
  panel.replaceChildren();
  panel.className = 'feedback';
  if (panel.hidden) return;
  if (attempt) {
    panel.classList.add(attempt.correct ? 'correct' : 'wrong');
    panel.append(element('strong', '', attempt.correct ? '回答正确' : '回答有误'));
  }
  panel.append(element('p', '', `参考答案　${answerText(question)}`));
  if (question.repaired) panel.append(element('p', '', '原稿题干有缺失，此题依据以下团务文件补全。'));
  if (question.basis) panel.append(element('p', '', `依据　${question.basis}`));
  if (question.link) {
    const source = element('a', '', '查看原文');
    source.href = question.link;
    source.target = '_blank';
    source.rel = 'noopener';
    panel.append(element('p'));
    panel.lastElementChild.append(source);
  }
}

function renderQuestion(question) {
  const body = element('div', 'question-body');
  const meta = element('div', 'question-meta');
  meta.append(element('span', 'kind', questionTypes[question.type]), element('span', 'position', `${index + 1} / ${queue.length}`));
  const title = element('h2', 'prompt');
  title.id = 'prompt';
  title.tabIndex = -1;
  title.append(element('small', '', `第 ${question.id} 题`), document.createTextNode(question.prompt));
  body.append(meta, title);
  if (question.type === 'multiple') body.append(element('p', 'hint', '请选择所有正确选项。'));

  const form = element('form');
  const fields = element('div', question.options ? 'option-list' : 'fill-fields');
  fields.setAttribute('role', 'group');
  fields.setAttribute('aria-labelledby', 'prompt');
  const actions = element('div', 'action-row');
  const submit = button('提交答案', 'button primary');
  submit.type = 'submit';
  const reveal = button('查看答案', 'button outline');
  const retry = button('重新作答', 'button outline');
  actions.append(submit, reveal, retry);
  const feedback = element('div', 'feedback');
  feedback.setAttribute('aria-live', 'polite');
  form.append(fields, actions, feedback);
  body.append(form);
  const nav = element('div', 'navigation');
  const previous = button('上一题', 'button outline', () => goTo(index - 1));
  previous.disabled = index === 0;
  const last = index === queue.length - 1;
  const next = button(last ? '本组概览' : '下一题', 'button outline', () => {
    if (last) {
      summary = true;
      render();
      get('prompt')?.focus();
    } else {
      goTo(index + 1);
    }
  });
  nav.append(previous, next);
  questionView.replaceChildren(body, nav);

  let attempt = retries.has(question.id) ? undefined : results[question.id];
  let revealed = false;
  let values = [...(drafts.get(question.id) || attempt?.values || [])];
  const available = () => values.length === controls.length && values.every(value => value?.trim());
  const controls = [];
  if (question.options) {
    for (const [key, name] of question.options) {
      const choice = button('', 'option', () => {
        if (question.type === 'multiple') {
          values = values.includes(key) ? values.filter(value => value !== key) : [...values, key];
        } else {
          values = [key];
        }
        drafts.set(question.id, values);
        sync();
      });
      choice.dataset.key = key;
      choice.append(element('span', 'option-letter', key), element('span', '', name));
      controls.push(choice);
      fields.append(choice);
    }
  } else {
    const count = (question.prompt.match(/_+/g) || []).length;
    for (let number = 0; number < count; number++) {
      const label = element('label', '', count === 1 ? '填入答案' : `第 ${number + 1} 空`);
      const input = element('input');
      input.type = 'text';
      input.autocomplete = 'off';
      input.value = values[number] || '';
      input.addEventListener('input', () => {
        values = controls.map(control => control.value);
        drafts.set(question.id, values);
        sync();
      });
      controls.push(input);
      label.append(input);
      fields.append(label);
    }
  }

  function sync() {
    const resolved = Boolean(attempt || revealed);
    submit.hidden = resolved;
    submit.disabled = question.options ? values.length === 0 : !available();
    reveal.hidden = resolved;
    retry.hidden = !resolved;
    for (const control of controls) {
      if (!question.options) {
        control.readOnly = resolved;
        continue;
      }
      const key = control.dataset.key;
      const selected = values.includes(key);
      const right = question.answer.includes(key);
      control.setAttribute('aria-pressed', String(selected));
      control.disabled = resolved;
      control.classList.toggle('correct', resolved && right);
      control.classList.toggle('wrong', resolved && Boolean(attempt) && selected && !right);
    }
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    if (submit.disabled || attempt || revealed) return;
    attempt = { values, correct: isCorrect(question, values) };
    results[question.id] = attempt;
    retries.delete(question.id);
    drafts.delete(question.id);
    sync();
    renderFeedback(feedback, question, attempt, revealed);
    updateOverview();
    renderMap();
    save();
  });
  reveal.addEventListener('click', () => {
    revealed = true;
    sync();
    renderFeedback(feedback, question, attempt, revealed);
  });
  retry.addEventListener('click', () => {
    retries.add(question.id);
    attempt = undefined;
    revealed = false;
    values = [];
    drafts.delete(question.id);
    if (!question.options) for (const input of controls) input.value = '';
    sync();
    renderFeedback(feedback, question, attempt, revealed);
    controls[0]?.focus();
  });
  sync();
  renderFeedback(feedback, question, attempt, revealed);
}

function renderSummary() {
  const area = element('div', 'empty');
  const title = element('h2', '', queue.length ? '本组练习概览' : '错题本是空的');
  title.id = 'prompt';
  title.tabIndex = -1;
  area.append(title);
  if (!queue.length) {
    area.append(element('p', '', '答错的题目会自动收录在这里。'), button('查看全部题目', 'button primary', () => chooseFilter('all')));
  } else {
    const answered = queue.filter(question => results[question.id]).length;
    const correct = queue.filter(question => results[question.id]?.correct).length;
    const firstUnanswered = queue.findIndex(question => !results[question.id]);
    const actions = element('div', 'action-row');
    area.append(element('p', '', `共 ${queue.length} 题，已做 ${answered} 题，答对 ${correct} 题。`), actions);
    if (firstUnanswered >= 0) {
      actions.append(button('继续未做题目', 'button primary', () => goTo(firstUnanswered)));
    }
    actions.append(button('回到本组第一题', 'button outline', () => goTo(0)));
    if (filter !== 'mistakes' && Object.values(results).some(result => !result.correct)) {
      actions.append(button('复习错题', 'button outline', () => chooseFilter('mistakes')));
    }
  }
  questionView.replaceChildren(area);
}

function render() {
  updateOverview();
  mapToggle.disabled = queue.length === 0;
  if (mapToggle.disabled) toggleMap(false);
  if (!summary && queue[index]) {
    const question = queue[index];
    positions[filter] = question.id;
    renderQuestion(question);
  } else {
    renderSummary();
  }
  renderMap();
  save();
}

for (const [scope, label] of Object.entries(filters)) {
  const item = button(label, 'filter', () => chooseFilter(scope));
  item.dataset.filter = scope;
  item.append(element('span', 'filter-count'));
  filterBar.append(item);
}
for (const item of orderBar.querySelectorAll('button')) {
  item.addEventListener('click', () => chooseOrder(item.dataset.order));
}
mapToggle.addEventListener('click', () => toggleMap(mapPanel.hidden));
makeQueue(positions[filter]);
render();
</script>
